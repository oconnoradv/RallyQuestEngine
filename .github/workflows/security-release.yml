name: Security checks and ZIP release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find motorcycle-rally-scoring-application -name '*.php' -print0 |
            xargs -0 -r -n 1 php -l
          node --check motorcycle-rally-scoring-application/assets/admin.js

      - name: Install static security scanner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install semgrep==1.180.0

      - name: Scan PHP and JavaScript for security findings
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan \
            --config p/php --config p/javascript \
            --metrics=off --disable-version-check \
            --strict --error --timeout 0 \
            motorcycle-rally-scoring-application

      - name: Scan for known dependency vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-dirs: .git,releases
          cache: false

      - name: Validate release version and build ZIP
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          plugin="motorcycle-rally-scoring-application"
          header_version="$(sed -n 's/^ \* Version: //p' "$plugin/$plugin.php")"
          constant_version="$(sed -n "s/^define( 'MRSA_VERSION', '\([^']*\)' );$/\1/p" "$plugin/$plugin.php")"
          stable_version="$(sed -n 's/^Stable tag: //p' "$plugin/readme.txt")"
          [[ "$version" == "$header_version" ]]
          [[ "$version" == "$constant_version" ]]
          [[ "$version" == "$stable_version" ]]
          mkdir dist
          zip -r "dist/$plugin-$RELEASE_TAG.zip" "$plugin"
          unzip -t "dist/$plugin-$RELEASE_TAG.zip"
          cd dist
          sha256sum "$plugin-$RELEASE_TAG.zip" > SHA256SUMS

      - name: Store verified release package
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish ZIP release
    needs: security
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
          path: dist

      - name: Verify checksum and publish
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" \
            "motorcycle-rally-scoring-application-$RELEASE_TAG.zip" SHA256SUMS \
            --verify-tag \
            --title "Motorcycle Rally Scoring Application $RELEASE_TAG" \
            --notes "Install the ZIP through WordPress Plugins > Add New > Upload Plugin. This source passed the workflow's syntax, Semgrep static security, and Trivy dependency/secret checks. These checks do not certify NIST compliance or absence of all CVEs; deployed WordPress, PHP, and other plugins require separate assessment. Scoring tabs remain placeholders."
