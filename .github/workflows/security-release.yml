name: Security checks and ZIP release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find motorcycle-rally-scoring-application -name '*.php' -print0 |
            xargs -0 -r -n 1 php -l
          node --check motorcycle-rally-scoring-application/assets/admin.js
          node tests/release-security.cjs

      - name: Check bonus image import behavior
        run: |
          php tests/bonus-import.php
          php tests/bonus-feedback.php
          php tests/diagnostics.php
          php tests/configuration-check.php
          php tests/image-queue.php
          php tests/roster-import.php
          php tests/backend-services.php
          php tests/read-models.php
          php tests/diagnostic-contracts.php

      - name: Install static security scanner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install semgrep==1.180.0

      - name: Verify WordPress exploit rules against regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/semgrep/bin/semgrep" --test \
            --config .github/semgrep/wordpress.yml tests/security/wordpress.php \
            --metrics=off --disable-version-check --strict

      - name: Scan PHP and JavaScript for security findings
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan \
            --config p/php --config p/javascript --config .github/semgrep/wordpress.yml \
            --metrics=off --disable-version-check \
            --strict --error --timeout 0 \
            motorcycle-rally-scoring-application

      - name: Check full Git history and working tree with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.24.3_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$archive"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --config .github/gitleaks.toml --redact --exit-code 1 --log-opts="--all" .
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --config .github/gitleaks.toml --redact --exit-code 1 .

      - name: Scan dependencies and secrets with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-dirs: .git,releases
          cache: false

      - name: Validate release version and build ZIP
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          plugin="motorcycle-rally-scoring-application"
          header_version="$(sed -n 's/^ \* Version: //p' "$plugin/$plugin.php")"
          constant_version="$(sed -n "s/^define( 'MRSA_VERSION', '\([^']*\)' );$/\1/p" "$plugin/$plugin.php")"
          stable_version="$(sed -n 's/^Stable tag: //p' "$plugin/readme.txt")"
          [[ "$version" == "$header_version" ]]
          [[ "$version" == "$constant_version" ]]
          [[ "$version" == "$stable_version" ]]
          mkdir dist
          zip -r "dist/$plugin-$RELEASE_TAG.zip" "$plugin"
          unzip -t "dist/$plugin-$RELEASE_TAG.zip"
          cd dist
          sha256sum "$plugin-$RELEASE_TAG.zip" > SHA256SUMS

      - name: Store verified release package
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  codeql:
    name: CodeQL release-source analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze the checked-out commit
        id: analyze
        uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          output: ${{ runner.temp }}/codeql-results
      - name: Reject CodeQL findings or incomplete reports
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { checkCodeQL } = require('./.github/scripts/release-security.cjs');
          const directory = process.env.SARIF_DIRECTORY;
          if (!directory) throw new Error('CodeQL did not return an output directory.');
          const reports = fs.readdirSync(directory).filter(file => file.endsWith('.sarif'))
            .map(file => JSON.parse(fs.readFileSync(path.join(directory, file), 'utf8')));
          checkCodeQL(reports);
          NODE

  dependabot:
    name: Dependabot release gate
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require Dependabot alert access
        env:
          ALERT_TOKEN: ${{ secrets.RELEASE_SECURITY_TOKEN }}
        run: |
          if [ -z "$ALERT_TOKEN" ]; then
            echo "::error::Configure RELEASE_SECURITY_TOKEN with Dependabot alerts read permission and enable repository Dependabot alerts."
            exit 1
          fi
      - name: Block all open Dependabot alerts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.RELEASE_SECURITY_TOKEN }}
          script: |
            const { checkDependabot } = require('./.github/scripts/release-security.cjs');
            await checkDependabot(github, context.repo);

  release:
    name: Publish ZIP release
    needs: [security, codeql, dependabot]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out verified release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Recheck Dependabot immediately before publication
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.RELEASE_SECURITY_TOKEN }}
          script: |
            const { checkDependabot } = require('./.github/scripts/release-security.cjs');
            await checkDependabot(github, context.repo);
      - name: Download verified release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
          path: dist

      - name: Verify checksum and publish
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" \
            "motorcycle-rally-scoring-application-$RELEASE_TAG.zip" SHA256SUMS \
            --verify-tag \
            --title "Motorcycle Rally Scoring Application $RELEASE_TAG" \
            --notes "Install the ZIP through WordPress Plugins > Add New > Upload Plugin. See the bundled readme changelog for this version's changes. This source passed syntax, Semgrep static security (including WordPress exploit rules), CodeQL JavaScript security analysis, Trivy dependency/secret, and Gitleaks history/working-tree secret checks. Publication also required no open repository Dependabot alerts. These checks do not certify NIST compliance or absence of all CVEs; deployed WordPress, PHP, and other plugins require separate assessment. The Event Bonus Point Library supports listing and image imports; bonus scoring calculations and submission review remain future work. Back up the database and event gallery files separately before upgrading."
